name: Build and Push Docker Image

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag (default: latest)'
        required: false
        default: 'latest'
      push:
        description: 'Push to Docker Hub'
        type: boolean
        default: true

env:
  DOCKER_IMAGE_NAME: account-management
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  DOCKER_HUB_REPOSITORY: ${{ secrets.DOCKER_HUB_USERNAME }}/account-management

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine if we should push
        id: should-push
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "push=false" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.push }}" == "false" ]; then
            echo "push=false" >> $GITHUB_OUTPUT
          else
            echo "push=true" >> $GITHUB_OUTPUT
          fi
          echo "Should push: ${{ steps.should-push.outputs.push }}"

      - name: Log in to Docker Hub
        if: steps.should-push.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_HUB_REPOSITORY }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ github.event.inputs.tag || 'latest' }},enable={{is_default_branch}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ steps.should-push.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.DOCKER_HUB_REPOSITORY }}:buildcache
          cache-to: type=inline
          platforms: linux/amd64,linux/arm64

      - name: Verify push status
        if: steps.should-push.outputs.push == 'true'
        run: |
          echo "Push was enabled, checking if image was pushed..."
          echo "Image digest: ${{ steps.build.outputs.digest }}"
          if [ -z "${{ steps.build.outputs.digest }}" ]; then
            echo "⚠️ Warning: No digest found, image might not have been pushed"
          else
            echo "✅ Image pushed successfully with digest: ${{ steps.build.outputs.digest }}"
          fi

      - name: Output image info
        if: github.event_name != 'pull_request'
        run: |
          echo "✅ Docker image built and pushed successfully!"
          echo "📦 Image: ${{ env.DOCKER_HUB_REPOSITORY }}"
          echo "🏷️  Tags: ${{ steps.meta.outputs.tags }}"
          echo ""
          echo "To use this image, update your .env file:"
          echo "ACCOUNT_MANAGEMENT_IMAGE=${{ env.DOCKER_HUB_REPOSITORY }}:${{ github.event.inputs.tag || 'latest' }}"

