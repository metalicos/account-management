spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/data_management_db
    driver-class-name: org.postgresql.Driver
    username: user
    password: password

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

