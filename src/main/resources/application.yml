spring:
  application:
    name: AccountManagement
  # Active profile: 'local' for H2 in-memory database, 'dev' for PostgreSQL
  # To change profile, use: --spring.profiles.active=dev
  # Or set environment variable: SPRING_PROFILES_ACTIVE=dev
  profiles:
    active: dev

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8080

jwt:
  secret: your-secret-key-that-is-at-least-256-bits-long-for-hs256-algorithm-please-change-in-production
  access-token-expiration: 3600000
  refresh-token-expiration: 86400000

logging:
  level:
    com.komplikevych.AccountManagement: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

