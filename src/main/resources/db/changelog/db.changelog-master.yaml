databaseChangeLog:
  - changeSet:
      id: 1
      author: system
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: first_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: middle_name
                  type: VARCHAR(100)
              - column:
                  name: gender
                  type: VARCHAR(20)
              - column:
                  name: date_of_birth
                  type: DATE
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: phone_number
                  type: VARCHAR(20)
              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: address_id
                  type: BIGINT
              - column:
                  name: access_count
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
              - column:
                  name: deleted_at
                  type: TIMESTAMP
        - createIndex:
            indexName: idx_user_email
            tableName: users
            columns:
              - column:
                  name: email
        - createIndex:
            indexName: idx_user_phone
            tableName: users
            columns:
              - column:
                  name: phone_number
        - createIndex:
            indexName: idx_user_deleted_at
            tableName: users
            columns:
              - column:
                  name: deleted_at

  - changeSet:
      id: 2
      author: system
      changes:
        - createTable:
            tableName: addresses
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: country
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: state
                  type: VARCHAR(100)
              - column:
                  name: city
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: postal_code
                  type: VARCHAR(20)
              - column:
                  name: street
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: building
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: entrance
                  type: VARCHAR(10)
              - column:
                  name: floor
                  type: VARCHAR(10)
              - column:
                  name: apartment
                  type: VARCHAR(20)
              - column:
                  name: intercom_code
                  type: VARCHAR(20)
        - addForeignKeyConstraint:
            baseTableName: users
            baseColumnNames: address_id
            constraintName: fk_user_address
            referencedTableName: addresses
            referencedColumnNames: id

  - changeSet:
      id: 3
      author: system
      changes:
        - createTable:
            tableName: user_roles
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: user_roles
            columnNames: user_id, role
            constraintName: uk_user_role
        - addForeignKeyConstraint:
            baseTableName: user_roles
            baseColumnNames: user_id
            constraintName: fk_user_role_user
            referencedTableName: users
            referencedColumnNames: id

  - changeSet:
      id: 4
      author: system
      changes:
        - dropNotNullConstraint:
            tableName: users
            columnName: first_name
            columnDataType: VARCHAR(100)
        - dropNotNullConstraint:
            tableName: users
            columnName: last_name
            columnDataType: VARCHAR(100)

